name: CardioAI Enterprise QA CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  selenium-tests:
    name: Selenium - CardioAI Web Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Website Tests
        run: java tests/RunTests.java selenium

      - name: Upload Selenium Excel Test Cases Sheet
        uses: actions/upload-artifact@v4
        with:
          name: selenium-excel-test-cases-sheet
          path: |
            tests/reports/selenium_test_cases.csv
            tests/reports/selenium-report.csv
            tests/reports/selenium-report.json

  appium-tests:
    name: Appium - CardioAI Android App Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Android Appium Tests
        run: java tests/RunTests.java appium

      - name: Upload Appium Excel Test Cases Sheet
        uses: actions/upload-artifact@v4
        with:
          name: appium-excel-test-cases-sheet
          path: |
            tests/reports/appium_test_cases.csv
            tests/reports/appium-report.csv
            tests/reports/appium-report.json

  api-tests:
    name: Unit Tests - CardioAI API & Cloud (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run API Unit Tests
        run: java tests/RunTests.java api

      - name: Upload API Excel Test Cases Sheet
        uses: actions/upload-artifact@v4
        with:
          name: api-excel-test-cases-sheet
          path: |
            tests/reports/api_test_cases.csv
            tests/reports/api-report.csv
            tests/reports/api-report.json

  validation-tests:
    name: Validation Tests - CardioAI Biomarkers (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Input Validation Tests
        run: java tests/RunTests.java validation

      - name: Upload Validation Excel Test Cases Sheet
        uses: actions/upload-artifact@v4
        with:
          name: validation-excel-test-cases-sheet
          path: |
            tests/reports/validation_test_cases.csv
            tests/reports/validation-report.csv
            tests/reports/validation-report.json

  deployment-status:
    name: Deployment Status - CardioAI Web & Mobile (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Deployment Checks
        run: java tests/RunTests.java deployment

      - name: Upload Deployment Excel Test Cases Sheet
        uses: actions/upload-artifact@v4
        with:
          name: deployment-excel-test-cases-sheet
          path: |
            tests/reports/deployment_test_cases.csv
            tests/reports/deployment-report.csv
            tests/reports/deployment-report.json

  load-tests:
    name: Load Testing - CardioAI Realtime Sync (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Performance Load Tests
        run: java tests/RunTests.java load

      - name: Upload Load Testing Excel Test Cases Sheet
        uses: actions/upload-artifact@v4
        with:
          name: load-excel-test-cases-sheet
          path: |
            tests/reports/load_test_cases.csv
            tests/reports/load-report.csv
            tests/reports/load-report.json

  compile-report:
    name: Compile CardioAI Master Report & Deploy
    needs: [selenium-tests, appium-tests, api-tests, validation-tests, deployment-status, load-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Reports Workspace
        run: mkdir -p tests/reports

      - name: Download Selenium Reports
        uses: actions/download-artifact@v4
        with:
          name: selenium-excel-test-cases-sheet
          path: tests/reports

      - name: Download Appium Reports
        uses: actions/download-artifact@v4
        with:
          name: appium-excel-test-cases-sheet
          path: tests/reports

      - name: Download API Reports
        uses: actions/download-artifact@v4
        with:
          name: api-excel-test-cases-sheet
          path: tests/reports

      - name: Download Validation Reports
        uses: actions/download-artifact@v4
        with:
          name: validation-excel-test-cases-sheet
          path: tests/reports

      - name: Download Deployment Reports
        uses: actions/download-artifact@v4
        with:
          name: deployment-excel-test-cases-sheet
          path: tests/reports

      - name: Download Load Reports
        uses: actions/download-artifact@v4
        with:
          name: load-excel-test-cases-sheet
          path: tests/reports

      - name: Compile Unified HTML Dashboard
        run: java tests/RunTests.java compile

      - name: Upload All CardioAI Excel Test Cases Sheets & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardio-ai-all-excel-test-cases-sheets
          path: |
            tests/reports/dashboard.html
            tests/reports/report.csv
            tests/reports/selenium_test_cases.csv
            tests/reports/appium_test_cases.csv
            tests/reports/api_test_cases.csv
            tests/reports/validation_test_cases.csv
            tests/reports/deployment_test_cases.csv
            tests/reports/load_test_cases.csv
            cardio_ai_test_cases.csv
            cardio_ai_master_test_cases.csv
            cardio_ai_apm_report.csv
            cardio_ai_apm_report.pdf
            cardio_ai_app_architecture.pdf
